set -g default-terminal "tmux-256color"
set -g escape-time 10
set -g history-limit 20000
set -g base-index 1

set -g status-style "bg=colour236,fg=colour250"
set -g status-left " llm-machine "
set -g status-left-length 20
set -g status-left-style "bg=colour173,fg=colour232,bold"
set -g status-right " F1 Claude  F2 Shell  F3 Network  F4 Sign-in code "
set -g status-right-length 60
setw -g window-status-format " #W "
setw -g window-status-current-format " #W "
setw -g window-status-current-style "fg=colour255,bold"

bind -n F1 select-window -t :claude
bind -n F2 select-window -t :shell
bind -n F3 display-popup -E -w 90% -h 90% "nmtui"
# run-shell reports a failure by putting the window in view mode; a popup closed from
# outside (the phone page does that) is not a failure.
bind -n F4 run-shell -b "llm-login-qr --show || true"
